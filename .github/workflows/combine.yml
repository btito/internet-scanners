name: Sync upstream and build combined lists

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: combine
  cancel-in-progress: false

jobs:
  combine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream (OpenFilters/internet-scanners)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/OpenFilters/internet-scanners.git
          git fetch --quiet upstream main
          git merge --no-edit upstream/main

      - name: Build combined lists
        run: |
          mkdir -p combined
          python3 scripts/combine.py

      - name: Commit and push
        run: |
          git add combined/
          if git diff --cached --quiet; then
            echo "No list changes"
          else
            git commit -m "Update combined scanner lists ($(date -u +%F))"
          fi
          git push origin HEAD
